<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartelera Simulacro Nacional 2026</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        background:#334155;font-family:'Segoe UI',Roboto,-apple-system,sans-serif;
        display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;
    }
    .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
    .bar button{
        background:#7C3AED;color:#fff;border:0;border-radius:8px;
        padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;
    }
    .bar button:hover{filter:brightness(1.08);}
    img{
        width:210mm;max-width:100%;height:auto;background:#fff;
        box-shadow:0 12px 40px rgba(0,0,0,.35);
    }
    @media print{
        @page{size:A4 portrait;margin:0;}
        body{background:#fff;padding:0;gap:0;}
        .bar{display:none;}
        img{width:auto;height:auto;max-width:100%;max-height:100vh;box-shadow:none;display:block;margin:0 auto;}
    }
</style>
</head>
<body>
    <div class="bar">
        <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    </div>
    <img src="cartelera-simulacro-nacional-2026.png"
         alt="Simulacro Nacional de Respuesta a Emergencias 2026 — miércoles 21 de octubre, 10:00 a. m. — Comité de Emergencias">
</body>
</html>
